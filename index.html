<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLADE CHESS</title>
    <style>
      :root {
        --bg: #071013;
        --surface: #101b1d;
        --surface-2: #162327;
        --light: #dfe8e3;
        --dark: #2a4d46;
        --accent: #88ff8f;
        --accent-2: #6ee7ff;
        --text: #edf7f8;
        --muted: #a1b3b8;
        --danger: #ff7f7a;
        --shadow: 0 18px 40px rgba(0,0,0,0.38);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: Inter, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #0d1a1f 0%, var(--bg) 40%, #05070a 100%);
        color: var(--text);
      }
      button, select, input {
        font: inherit;
      }
      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        border-bottom: 1px solid rgba(110,231,255,0.12);
        background: rgba(7,16,19,0.8);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: 0.08em;
        font-weight: 900;
        text-transform: uppercase;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #071013;
        box-shadow: 0 0 12px rgba(136,255,143,0.7);
      }
      .nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .nav button {
        background: rgba(16,27,29,0.7);
        color: var(--text);
        border: 1px solid rgba(110,231,255,0.15);
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .nav button.active {
        color: var(--accent);
        border-color: rgba(136,255,143,0.55);
        box-shadow: 0 0 0 1px rgba(136,255,143,0.18);
      }
      .main {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.45fr 0.9fr;
        gap: 20px;
      }
      .panel {
        background: linear-gradient(180deg, rgba(20,31,35,0.96), rgba(12,20,23,0.96));
        border: 1px solid rgba(110,231,255,0.12);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }
      .panel-header {
        padding: 18px 20px 0;
      }
      .panel-header h2 {
        margin: 0;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .board-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 18px 20px 12px;
      }
      .board {
        width: min(74vw, 620px);
        max-width: 100%;
        aspect-ratio: 1;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 18px 28px rgba(0,0,0,0.35);
      }
      .square {
        position: relative;
        display: grid;
        place-items: center;
        font-size: clamp(1.8rem, 2.9vw, 3.2rem);
        user-select: none;
        cursor: pointer;
      }
      .square.light { background: var(--light); color: #1b1b1b; }
      .square.dark { background: var(--dark); color: #e9f3ee; }
      .square.selected { box-shadow: inset 0 0 0 4px rgba(136,255,143,0.96); }
      .square.last-move { box-shadow: inset 0 0 0 4px rgba(110,231,255,0.92); }
      .square.legal::after {
        content: "";
        position: absolute;
        width: 18%;
        height: 18%;
        border-radius: 50%;
        background: rgba(15, 28, 26, 0.6);
        box-shadow: 0 0 0 8px rgba(136,255,143,0.15);
      }
      .coord {
        position: absolute;
        font-size: 0.62rem;
        font-weight: 800;
        opacity: 0.75;
        z-index: 1;
      }
      .coord.rank { top: 4px; left: 6px; }
      .coord.file { right: 6px; bottom: 4px; }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 0 20px 20px;
      }
      .status-pill {
        background: rgba(110,231,255,0.08);
        border: 1px solid rgba(110,231,255,0.18);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--accent-2);
        font-size: 0.76rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button.primary, button.secondary {
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        font-weight: 800;
        cursor: pointer;
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), #52e07c);
        color: #071013;
      }
      button.secondary {
        background: rgba(110,231,255,0.08);
        color: var(--text);
        border: 1px solid rgba(110,231,255,0.15);
      }
      .side-stack {
        display: grid;
        gap: 20px;
      }
      .meta-list {
        display: grid;
        gap: 10px;
        padding: 0 20px 20px;
      }
      .meta-item {
        background: rgba(11,19,21,0.66);
        border: 1px solid rgba(110,231,255,0.08);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .meta-item strong {
        display: block;
        color: var(--accent);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .move-list {
        display: grid;
        gap: 8px;
        max-height: 250px;
        overflow: auto;
        padding: 0 20px 20px;
      }
      .move-row {
        display: grid;
        grid-template-columns: 42px 1fr 1fr;
        gap: 8px;
        padding: 8px 10px;
        background: rgba(11,19,21,0.7);
        border: 1px solid rgba(110,231,255,0.08);
        border-radius: 10px;
      }
      .move-row .move-num { color: var(--muted); }
      .coach-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        padding: 20px;
      }
      .coach-card {
        background: rgba(11,19,21,0.7);
        border: 1px solid rgba(110,231,255,0.1);
        border-radius: 20px;
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .coach-card.selected {
        border-color: rgba(136,255,143,0.6);
        box-shadow: 0 0 0 1px rgba(136,255,143,0.2);
      }
      .coach-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .coach-avatar {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: rgba(136,255,143,0.08);
        border: 1px solid rgba(136,255,143,0.22);
        font-size: 1.7rem;
      }
      .coach-card p { margin: 0; color: var(--muted); line-height: 1.5; }
      .coach-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag {
        background: rgba(110,231,255,0.08);
        color: var(--accent-2);
        border: 1px solid rgba(110,231,255,0.12);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .settings-wrap {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        padding: 20px;
      }
      .setting-box {
        background: rgba(11,19,21,0.7);
        border: 1px solid rgba(110,231,255,0.08);
        border-radius: 18px;
        padding: 18px;
      }
      .setting-box h3 {
        margin: 0 0 12px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-size: 0.8rem;
      }
      label {
        display: block;
        color: var(--muted);
        margin-bottom: 6px;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(110,231,255,0.15);
        background: rgba(10,16,18,0.85);
        color: var(--text);
        margin-bottom: 12px;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(110,231,255,0.08);
      }
      .toggle:last-child { border-bottom: none; }
      .switch {
        position: relative;
        width: 48px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(110,231,255,0.14);
        cursor: pointer;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--text);
        transition: 0.2s ease;
      }
      .switch.on {
        background: rgba(136,255,143,0.2);
        border-color: rgba(136,255,143,0.4);
      }
      .switch.on::after {
        left: 24px;
        background: var(--accent);
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">B</div>
            <div>BLADE CHESS</div>
          </div>
          <nav class="nav">
            <button class="active" data-page="home">Home</button>
            <button data-page="play">Play Chess</button>
            <button data-page="coaches">Coaches</button>
            <button data-page="settings">Settings</button>
          </nav>
        </div>
      </header>

      <main class="main">
        <section id="page-home" class="page active">
          <div class="grid">
            <div class="panel">
              <div class="panel-header"><h2>Overview</h2></div>
              <div class="board-wrap">
                <div id="home-board" class="board" aria-label="Home board"></div>
              </div>
              <div class="controls">
                <div class="status-pill" id="home-status">White to move</div>
                <div class="button-row">
                  <button class="primary" id="home-new-game">New Game</button>
                  <button class="secondary" data-page="play">Open Board</button>
                </div>
              </div>
            </div>
            <div class="side-stack">
              <div class="panel">
                <div class="panel-header"><h2>Selected Coach</h2></div>
                <div id="coachSummary" style="padding:20px;"></div>
              </div>
              <div class="panel">
                <div class="panel-header"><h2>Quick Settings</h2></div>
                <div class="meta-list">
                  <div class="meta-item"><strong>Difficulty</strong><span id="difficultyLabel">Medium</span></div>
                  <div class="meta-item"><strong>Orientation</strong><span id="orientationLabel">White</span></div>
                  <div class="meta-item"><strong>Saved Games</strong><span id="savedGamesCount">0</span></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="page-play" class="page">
          <div class="grid">
            <div class="panel">
              <div class="panel-header"><h2>Play Chess</h2></div>
              <div class="board-wrap">
                <div id="board" class="board" aria-label="Chess board"></div>
              </div>
              <div class="controls">
                <div class="status-pill" id="status-pill">White to move</div>
                <div class="button-row">
                  <button class="secondary" id="undo-btn">Undo</button>
                  <button class="secondary" id="restart-btn">Restart</button>
                  <button class="secondary" id="flip-btn">Flip</button>
                </div>
              </div>
            </div>

            <div class="side-stack">
              <div class="panel">
                <div class="panel-header"><h2>Game Details</h2></div>
                <div class="meta-list">
                  <div class="meta-item"><strong>Turn</strong><span id="turnLabel">White</span></div>
                  <div class="meta-item"><strong>Result</strong><span id="resultLabel">In progress</span></div>
                </div>
              </div>

              <div class="panel">
                <div class="panel-header"><h2>Move History</h2></div>
                <div id="move-list" class="move-list"></div>
              </div>
            </div>
          </div>
        </section>

        <section id="page-coaches" class="page">
          <div class="panel">
            <div class="panel-header"><h2>Choose Coach</h2></div>
            <div id="coach-grid" class="coach-grid"></div>
          </div>
        </section>

        <section id="page-settings" class="page">
          <div class="panel">
            <div class="panel-header"><h2>Settings</h2></div>
            <div class="settings-wrap">
              <div class="setting-box">
                <h3>General</h3>
                <label>Player name</label>
                <input id="player-name" type="text" placeholder="Player One" />
                <label>Difficulty</label>
                <select id="difficulty-select">
                  <option value="beginner">Beginner</option>
                  <option value="easy">Easy</option>
                  <option value="medium">Medium</option>
                  <option value="hard">Hard</option>
                  <option value="expert">Expert</option>
                </select>
                <label>Board orientation</label>
                <select id="orientation-select">
                  <option value="white">White</option>
                  <option value="black">Black</option>
                </select>
              </div>

              <div class="setting-box">
                <h3>Appearance</h3>
                <div class="toggle"><span>Show legal moves</span><div class="switch on" id="legal-toggle"></div></div>
                <div class="toggle"><span>Show coordinates</span><div class="switch on" id="coords-toggle"></div></div>
                <div class="toggle"><span>Sound</span><div class="switch on" id="sound-toggle"></div></div>
              </div>

              <div class="setting-box">
                <h3>Coach</h3>
                <label>Selected coach</label>
                <select id="coach-select"></select>
                <button class="primary" id="save-settings-btn" style="margin-top:8px;">Save Settings</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.min.js"></script>
    <script>
      const STORAGE_KEY = 'blade-chess-settings';
      const defaultSettings = {
        playerName: 'Player One',
        difficulty: 'medium',
        orientation: 'white',
        showLegalMoves: true,
        showCoordinates: true,
        sound: true,
        coach: 'nova'
      };

      const coaches = {
        nova: { name: 'Nova', emoji: '⚔️', description: 'Tactical and precise. Focuses on forcing moves and sharp decisions.', tags: ['Tactics', 'Threats', 'Precision'] },
        rook: { name: 'Rook', emoji: '🏰', description: 'Hard-charging and practical. Looks for structure and control.', tags: ['Control', 'Strategy', 'Endgames'] },
        sage: { name: 'Sage', emoji: '🧠', description: 'Calm and teaching. Explains ideas in simple, friendly terms.', tags: ['Teaching', 'Patience', 'Planning'] },
        spark: { name: 'Spark', emoji: '⚡', description: 'Aggressive and creative. Seeks initiative and attacking chances.', tags: ['Attack', 'Initiative', 'Creativity'] }
      };

      const pieceMap = {
        w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
        b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
      };

      const game = new Chess();
      const state = {
        selectedSquare: null,
        orientation: 'white',
        settings: loadSettings(),
        activePage: 'home'
      };

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...defaultSettings };
          return { ...defaultSettings, ...JSON.parse(raw) };
        } catch {
          return { ...defaultSettings };
        }
      }

      function saveSettings() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.settings));
      }

      function setPage(page) {
        state.activePage = page;
        document.querySelectorAll('.nav button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.page === page);
        });
        document.querySelectorAll('.page').forEach(el => {
          el.classList.toggle('active', el.id === `page-${page}`);
        });
      }

      function renderCoachSummary() {
        const selected = coaches[state.settings.coach] || coaches.nova;
        const el = document.getElementById('coachSummary');
        if (!el) return;
        el.innerHTML = `
          <div class="coach-head">
            <div class="coach-avatar">${selected.emoji}</div>
            <div>
              <strong>${selected.name}</strong><br>
              <span style="color: var(--muted);">${selected.description}</span>
            </div>
          </div>
          <div class="coach-tags" style="margin-top:10px;">
            ${selected.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        `;
      }

      function renderCoachCards() {
        const grid = document.getElementById('coach-grid');
        if (!grid) return;
        grid.innerHTML = Object.entries(coaches).map(([id, coach]) => `
          <div class="coach-card ${state.settings.coach === id ? 'selected' : ''}">
            <div class="coach-head">
              <div class="coach-avatar">${coach.emoji}</div>
              <div>
                <strong>${coach.name}</strong><br>
                <span style="color: var(--muted);">${coach.description}</span>
              </div>
            </div>
            <div class="coach-tags">
              ${coach.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <button class="${state.settings.coach === id ? 'primary' : 'secondary'}" data-coach-id="${id}">
              ${state.settings.coach === id ? 'Selected' : 'Select'}
            </button>
          </div>
        `).join('');
      }

      function updateSettingsInputs() {
        const playerName = document.getElementById('player-name');
        if (playerName) playerName.value = state.settings.playerName;

        const diff = document.getElementById('difficulty-select');
        if (diff) diff.value = state.settings.difficulty;

        const orient = document.getElementById('orientation-select');
        if (orient) orient.value = state.settings.orientation;

        const coachSelect = document.getElementById('coach-select');
        if (coachSelect) {
          coachSelect.innerHTML = Object.entries(coaches).map(([id, coach]) => `<option value="${id}">${coach.name}</option>`).join('');
          coachSelect.value = state.settings.coach;
        }

        document.getElementById('difficultyLabel').textContent = capitalize(state.settings.difficulty);
        document.getElementById('orientationLabel').textContent = capitalize(state.settings.orientation);

        const legalToggle = document.getElementById('legal-toggle');
        if (legalToggle) legalToggle.classList.toggle('on', !!state.settings.showLegalMoves);
        const coordsToggle = document.getElementById('coords-toggle');
        if (coordsToggle) coordsToggle.classList.toggle('on', !!state.settings.showCoordinates);
        const soundToggle = document.getElementById('sound-toggle');
        if (soundToggle) soundToggle.classList.toggle('on', !!state.settings.sound);
      }

      function capitalize(text) {
        return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
      }

      function getBoardFiles() {
        return state.settings.orientation === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
      }

      function getBoardRanks() {
        return state.settings.orientation === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
      }

      function legalTargets(square) {
        if (!square) return [];
        const moves = game.moves({ square, verbose: true });
        return moves.map(move => move.to);
      }

      function renderBoard(targetId) {
        const board = document.getElementById(targetId);
        if (!board) return;

        const files = getBoardFiles();
        const ranks = getBoardRanks();
        const squares = [];

        for (let r = 0; r < ranks.length; r++) {
          for (let f = 0; f < files.length; f++) {
            const file = files[f];
            const rank = ranks[r];
            const square = `${file}${rank}`;
            const piece = game.get(square);
            const isLight = (r + f) % 2 === 0;
            let cls = `square ${isLight ? 'light' : 'dark'}`;

            if (state.selectedSquare === square) cls += ' selected';
            const lastMoves = game.history({ verbose: true }).map(m => [m.from, m.to]).flat();
            if (lastMoves.includes(square)) cls += ' last-move';

            const legal = legalTargets(state.selectedSquare);
            if (state.settings.showLegalMoves && state.selectedSquare && legal.includes(square)) {
              cls += ' legal';
            }

            const coordRank = state.settings.showCoordinates && (file === 'a' || file === 'h') ? `<span class="coord rank">${rank}</span>` : '';
            const coordFile = state.settings.showCoordinates && (rank === 1 || rank === 8) ? `<span class="coord file">${file}</span>` : '';
            const pieceDisplay = piece ? pieceMap[piece.color][piece.type] : '';
            squares.push(`<div class="${cls}" data-square="${square}">${coordRank}${coordFile}${pieceDisplay}</div>`);
          }
        }

        board.innerHTML = squares.join('');
        board.querySelectorAll('.square').forEach(el => {
          el.addEventListener('click', () => handleSquareClick(el.dataset.square, targetId));
        });
      }

      function renderMoveList() {
        const container = document.getElementById('move-list');
        if (!container) return;
        const history = game.history({ verbose: true });
        const rows = [];
        for (let i = 0; i < history.length; i += 2) {
          const white = history[i];
          const black = history[i + 1];
          rows.push(`
            <div class="move-row">
              <span class="move-num">${Math.floor(i / 2) + 1}.</span>
              <span>${white ? white.san : ''}</span>
              <span>${black ? black.san : ''}</span>
            </div>
          `);
        }
        container.innerHTML = rows.join('');
      }

      function updateStatus() {
        const turn = game.turn() === 'w' ? 'White' : 'Black';
        const text = game.isCheckmate() ? `${turn === 'White' ? 'Black' : 'White'} wins by checkmate` :
          game.isStalemate() ? 'Draw by stalemate' :
          game.isThreefoldRepetition() ? 'Draw by repetition' :
          game.isInsufficientMaterial() ? 'Draw by insufficient material' :
          game.isDraw() ? 'Draw' : `${turn} to move`;

        const pill = document.getElementById('status-pill');
        if (pill) pill.textContent = text;
        const homeStatus = document.getElementById('home-status');
        if (homeStatus) homeStatus.textContent = text;
        const turnLabel = document.getElementById('turnLabel');
        if (turnLabel) turnLabel.textContent = turn;
        const resultLabel = document.getElementById('resultLabel');
        if (resultLabel) resultLabel.textContent = game.isGameOver() ? (game.isCheckmate() ? `${turn === 'White' ? 'Black' : 'White'} wins` : 'Game over') : 'In progress';
      }

      function playTone() {
        if (!state.settings.sound) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        const ctx = new AudioCtor();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.value = 540;
        gain.gain.value = 0.04;
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.08);
      }

      function handleSquareClick(square, targetId) {
        if (!square) return;
        const piece = game.get(square);

        if (state.selectedSquare) {
          const move = game.move({ from: state.selectedSquare, to: square, promotion: 'q' });
          if (move) {
            playTone();
            state.selectedSquare = null;
            renderAll();
            return;
          }
          if (piece && piece.color === game.turn()) {
            state.selectedSquare = square;
            renderAll();
            return;
          }
          state.selectedSquare = null;
          renderAll();
          return;
        }

        if (piece && piece.color === game.turn()) {
          state.selectedSquare = square;
          renderAll();
        }
      }

      function renderAll() {
        renderBoard('board');
        renderBoard('home-board');
        renderMoveList();
        updateStatus();
      }

      function restartGame() {
        game.reset();
        state.selectedSquare = null;
        renderAll();
      }

      function undoMove() {
        game.undo();
        state.selectedSquare = null;
        renderAll();
      }

      function flipBoard() {
        state.settings.orientation = state.settings.orientation === 'white' ? 'black' : 'white';
        saveSettings();
        updateSettingsInputs();
        renderAll();
      }

      function bindEvents() {
        document.querySelectorAll('.nav button').forEach(btn => {
          btn.addEventListener('click', () => setPage(btn.dataset.page));
        });

        document.getElementById('undo-btn').addEventListener('click', undoMove);
        document.getElementById('restart-btn').addEventListener('click', restartGame);
        document.getElementById('flip-btn').addEventListener('click', flipBoard);
        document.getElementById('home-new-game').addEventListener('click', restartGame);

        document.getElementById('save-settings-btn').addEventListener('click', () => {
          const playerNameInput = document.getElementById('player-name');
          if (playerNameInput) state.settings.playerName = playerNameInput.value.trim() || 'Player One';

          const difficulty = document.getElementById('difficulty-select');
          if (difficulty) state.settings.difficulty = difficulty.value;

          const orientation = document.getElementById('orientation-select');
          if (orientation) state.settings.orientation = orientation.value;

          const activeCoach = document.getElementById('coach-select');
          if (activeCoach) state.settings.coach = activeCoach.value;

          saveSettings();
          updateSettingsInputs();
          renderCoachSummary();
          renderCoachCards();
          renderAll();
        });

        document.getElementById('coach-grid').addEventListener('click', (event) => {
          const btn = event.target.closest('[data-coach-id]');
          if (!btn) return;
          state.settings.coach = btn.dataset.coachId;
          saveSettings();
          renderCoachSummary();
          renderCoachCards();
          updateSettingsInputs();
        });

        document.getElementById('legal-toggle').addEventListener('click', () => {
          state.settings.showLegalMoves = !state.settings.showLegalMoves;
          saveSettings();
          updateSettingsInputs();
          renderAll();
        });

        document.getElementById('coords-toggle').addEventListener('click', () => {
          state.settings.showCoordinates = !state.settings.showCoordinates;
          saveSettings();
          updateSettingsInputs();
          renderAll();
        });

        document.getElementById('sound-toggle').addEventListener('click', () => {
          state.settings.sound = !state.settings.sound;
          saveSettings();
          updateSettingsInputs();
        });
      }

      function init() {
        state.settings = loadSettings();
        state.orientation = state.settings.orientation;
        renderCoachSummary();
        renderCoachCards();
        updateSettingsInputs();
        bindEvents();
        renderAll();
        setPage('home');
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
